previews:
  generation: off

services:
  - type: web
    name: lern-bank-geldautomat
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: LERN-Bank Mein Geldautomat
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_LOCALE
        value: de
      - key: APP_FALLBACK_LOCALE
        value: de
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_HTTP_ONLY
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PUBLIC_DEMO_ENABLED
        value: "true"
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: TRUSTED_PROXIES
        value: "*"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
