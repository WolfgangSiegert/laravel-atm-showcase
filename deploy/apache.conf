ServerName localhost

<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog /proc/self/fd/2
    # Paths can contain receipt identifiers; omit query strings and remote IPs.
    LogFormat "%m %U %>s" showcase
    CustomLog /proc/self/fd/1 showcase
</VirtualHost>

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
